function renderOrders(){const orders=orderList();return `${top('Penjualan e-book','Riwayat pembelian atau distribusi buku digital yang kamu catat.',btn('sell-book',`${ic('plus')} Catat penjualan`)+btn('export-orders',`${ic('download')} CSV`,'btn-secondary'))}${demoBanner()}<section class="card panel"><div class="toolbar"><label class="search">${ic('search')}<input type="search" id="orderSearch" value="${esc(orderQuery)}" placeholder="Cari buku atau pembeli…" aria-label="Cari penjualan"></label><span class="muted">${num(orders.length)} catatan</span></div>${orders.length?`<div class="table-scroll"><table class="table"><thead><tr><th>Tanggal</th><th>E-book</th><th>Pembeli</th><th>Jumlah</th><th>Metode</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${pretty(o.date)}</td><td>${esc(o.label)}</td><td>${esc(o.buyer||'—')}</td><td>${num(o.qty)}</td><td>${esc(o.method)}</td><td class="money">${fmt(o.amount)}</td><td>${btn('delete-sale',ic('trash'),'btn-danger btn-tiny',`data-id="${esc(o.id)}" aria-label="Hapus transaksi"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada penjualan','Penjualan e-book yang kamu catat akan ditampilkan di sini.')}</section>`}
function finance(){const a=amountStats(financeMonth),sales=salesIn(financeMonth).sort(byDate),expenses=expensesIn(financeMonth).sort(byDate);return `${top('Keuangan bisnis','Pantau pemasukan member, e-book, pengeluaran, dan selisih bersih.',btn('add-expense',`${ic('plus')} Pengeluaran`)+btn('export-finance',`${ic('download')} Ekspor CSV`,'btn-secondary'))}${demoBanner()}<div class="toolbar"><div class="filter-group"><label class="muted" for="financeMonth">Periode laporan</label><input class="field" type="month" id="financeMonth" value="${esc(financeMonth)}"></div></div><div class="stats">${stat('Omzet total',fmt(a.total),`${num(a.sales)} transaksi`,'wallet')}${stat('Pemasukan member',fmt(a.member),'VIP Umum dan VIP Privat','users','green')}${stat('Penjualan e-book',fmt(a.ebooks),'Produk edukasi digital','book')}${stat('Selisih bersih',fmt(a.net),`Pengeluaran ${fmt(a.spent)}`,'chart')}</div><div class="finance-grid"><section class="card panel"><div class="panel-head"><div><h3>Pemasukan</h3><p>Catatan transaksi masuk · ${esc(monthName(financeMonth))}</p></div></div>${sales.length?`<div class="table-scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Sumber</th><th>Nama</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${pretty(s.date)}</td><td>${s.kind==='member'?'Member VIP':'E-book'}</td><td>${esc(s.buyer||s.label)}</td><td class="money">${fmt(s.amount)}</td><td>${btn('delete-sale',ic('trash'),'btn-danger btn-tiny',`data-id="${esc(s.id)}" aria-label="Hapus pemasukan"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada pemasukan','Catat pembayaran member atau e-book.')}</section><section class="card panel"><div class="panel-head"><div><h3>Pengeluaran</h3><p>Biaya operasional tercatat · ${esc(monthName(financeMonth))}</p></div></div>${expenses.length?`<div class="table-scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Keperluan</th><th>Kategori</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${expenses.map(e=>`<tr><td>${pretty(e.date)}</td><td>${esc(e.label)}</td><td>${esc(e.category)}</td><td class="money">${fmt(e.amount)}</td><td>${btn('delete-expense',ic('trash'),'btn-danger btn-tiny',`data-id="${esc(e.id)}" aria-label="Hapus pengeluaran"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada pengeluaran','Catat biaya promosi, operasional, dan lainnya.')}</section></div><div class="notice smalltop">Selisih bersih = omzet tercatat − pengeluaran tercatat. Angka ini bukan laporan laba bersih akuntansi lengkap; belum mencakup pajak, piutang, penyusutan, atau biaya yang belum diinput.</div>`}
function reports(){const a=amountStats(reportMonth),members=db.members.filter(m=>m.start.slice(0,7)===reportMonth),books={};db.sales.filter(s=>s.kind==='ebook'&&s.date.slice(0,7)===reportMonth).forEach(x=>{books[x.label]=(books[x.label]||0)+x.qty});const popular=Object.entries(books).sort((a,b)=>b[1]-a[1]);return `${top('Laporan performa','Analisis bulanan pertumbuhan member dan produk edukasi.',btn('export-report',`${ic('download')} Unduh ringkasan`,'btn-secondary'))}${demoBanner()}<div class="toolbar"><div class="filter-group"><label class="muted" for="reportMonth">Pilih bulan</label><input type="month" class="field" id="reportMonth" value="${esc(reportMonth)}"></div></div><div class="stats">${stat('Member bergabung',num(members.length),'Berdasarkan tanggal mulai','users')}${stat('Member VIP Umum',num(members.filter(m=>m.plan==='vip').length),'Pendaftaran bulan terpilih','crown')}${stat('Member VIP Privat',num(members.filter(m=>m.plan==='private').length),'Pendaftaran bulan terpilih','crown','green')}${stat('Omzet',fmt(a.total),'Transaksi tercatat','wallet')}</div><div class="cols"><section class="card panel"><div class="panel-head"><div><h3>Kontribusi pendapatan</h3><p>${esc(monthName(reportMonth))}</p></div></div>${moneyBreakdown(a)}</section><section class="card panel"><div class="panel-head"><div><h3>E-book paling banyak dicatat</h3><p>Berdasarkan jumlah unit</p></div></div>${popular.length?`<div class="recent">${popular.slice(0,5).map(([name,qty],i)=>`<div class="recent-row"><span class="recent-icon">${i+1}</span><div class="recent-label"><b>${esc(name)}</b><small>E-book edukasi saham</small></div><b>${num(qty)} unit</b></div>`).join('')}</div>`:empty('Belum ada penjualan','Data e-book terjual akan muncul di sini.')}</section></div>`}
function settings(){const s=db.settings;return `${top('Pengaturan YooImprove','Sesuaikan identitas bisnis, harga contoh, dan data aplikasi.')}${demoBanner()}<div class="cols"><section class="card panel"><div class="panel-head"><div><h3>Informasi bisnis</h3><p>Digunakan dalam dashboard dan etalase e-book</p></div></div><form id="settingsForm"><div class="form-grid"><div class="form-field full"><label for="settingName">Nama brand</label><input class="field" name="name" id="settingName" maxlength="80" required value="${esc(s.name)}"></div><div class="form-field"><label for="settingWa">WhatsApp order (628xxx)</label><input class="field" name="wa" id="settingWa" placeholder="628123456789" value="${esc(s.wa)}"></div><div class="form-field"><label for="settingIG">Instagram (opsional)</label><input class="field" name="instagram" id="settingIG" placeholder="@yooimprove" value="${esc(s.instagram)}"></div><div class="form-field"><label for="settingVIP">Harga default VIP Umum (Rp)</label><input class="field" name="vip" id="settingVIP" type="number" min="0" step="1" required value="${s.vip}"></div><div class="form-field"><label for="settingPrivate">Harga default VIP Privat (Rp)</label><input class="field" name="private" id="settingPrivate" type="number" min="0" step="1" required value="${s.private}"></div></div><div class="actions smalltop"><button type="submit" class="btn btn-gold">${ic('check')} Simpan pengaturan</button></div></form></section><section class="card panel"><div class="panel-head"><div><h3>Data dan cadangan</h3><p>Semua data disimpan hanya pada browser ini</p></div></div><div class="recent"><div class="recent-row"><span class="recent-icon">${ic('download')}</span><div class="recent-label"><b>Cadangkan data</b><small>Unduh semua member dan transaksi (.json)</small></div>${btn('backup','Backup','btn-secondary btn-tiny')}</div><div class="recent-row"><span class="recent-icon">${ic('upload')}</span><div class="recent-label"><b>Pulihkan cadangan</b><small>Mengganti data pada browser ini</small></div>${btn('restore','Impor','btn-secondary btn-tiny')}</div><div class="recent-row"><span class="recent-icon">${ic('trash')}</span><div class="recent-label"><b>Mulai dari kosong</b><small>Hapus data contoh atau data lokal</small></div>${btn('reset','Reset','btn-danger btn-tiny')}</div></div><div class="notice smalltop"><b>Perhatian keamanan:</b> versi HTML ini belum punya akun admin, sinkronisasi cloud, atau database server. Jangan gunakan untuk data pribadi/member sungguhan di website publik sebelum sistem login dan backend dibuat.</div></section></div>`}
function store(){const books=db.books.filter(x=>x.enabled);return `<div class="storefront"><header class="store-header"><div class="brand" style="padding:0"><div class="brand-icon">Y</div><div><div class="brand-main">Yoo<span>Improve</span></div><div class="brand-sub">STOCK MARKET EDUCATION</div></div></div>${btn('go-dashboard','Dashboard demo','btn-secondary btn-tiny')}</header><section class="store-hero"><span class="eyebrow">BELAJAR · BERTUMBUH · BERKEMBANG</span><h1>Investasi pada <span>pengetahuan</span> dimulai di sini.</h1><p>Jelajahi koleksi e-book edukasi saham YooImprove. Mulai dari dasar, fundamental, teknikal, hingga bandarmology.</p>${btn('store-books',`${ic('arrow')} Jelajahi e-book`)}</section><section class="store-content" id="storeBooks"><span class="eyebrow">YOOIMPROVE LIBRARY</span><h2>Koleksi e-book</h2><div class="catalog">${books.map(b=>renderBookCard(b,true)).join('')||empty('Belum ada e-book','Koleksi belum tersedia.')}</div><div class="store-note">Pratinjau etalase · pemesanan via WhatsApp, bukan checkout otomatis · edukasi, bukan rekomendasi investasi.</div></section><footer class="store-footer">© ${new Date().getFullYear()} ${esc(db.settings.name)} · Stock Market Education</footer></div>`}
function navButton(routeName,iconName,label=ROUTES[routeName]){return `<button type="button" data-route="${routeName}" class="${route===routeName?'active':''}">${ic(iconName)} ${esc(label)}</button>`}
function frame(body){if(route==='store')return store();return `<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">Y</div><div><div class="brand-main">Yoo<span>Improve</span></div><div class="brand-sub">BUSINESS SUITE</div></div></div><div class="side-heading">WORKSPACE</div><nav class="nav">${navButton('dashboard','grid')}${navButton('members','users')}${navButton('plans','crown')}${navButton('ebooks','book')}${navButton('orders','receipt')}</nav><div class="side-heading">OPERASIONAL</div><nav class="nav">${navButton('finance','wallet')}${navButton('reports','chart')}${navButton('settings','settings')}${navButton('store','external','Etalase e-book')}</nav><div class="side-spacer"></div><div class="side-promo"><span>✦</span><b>Grow with knowledge.</b><p>Kelola edukasi saham, komunitas VIP, dan bisnis digital dalam satu workspace.</p></div><div class="side-foot"><span class="dot"></span> Mode lokal · data browser</div></aside><div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button type="button" class="icon-btn menu-toggle" id="menuBtn" aria-label="Buka menu">${ic('menu')}</button><div class="crumb">Workspace &nbsp;/&nbsp; <b>${esc(ROUTES[route])}</b></div></div><div class="top-right"><span>${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</span><div class="avatar">YI</div></div></header><main class="content" id="content">${body}</main><div class="foot">YooImprove · Dashboard edukasi saham · Versi HTML lokal</div></div></div><nav class="mobile-nav">${navButton('dashboard','grid','Beranda')}${navButton('members','users','Member')}${navButton('ebooks','book','E-book')}${navButton('finance','wallet','Keuangan')}${navButton('reports','chart','Laporan')}</nav>`}
function render(){document.title=(route==='store'?'Koleksi E-book':'Dashboard')+' — YooImprove';const views={dashboard:overview,members:renderMembers,plans:renderPlans,ebooks:renderBooks,orders:renderOrders,finance,reports,settings,store};$('#root').innerHTML=frame(views[route]?.()||overview());}
function navigate(r){if(!ROUTES[r])return;route=r;history.replaceState(null,'','#'+r);render();window.scrollTo({top:0,behavior:'instant'});$('#overlay').classList.remove('active')}
function modal(title,description,html){$('#dialogContent').innerHTML=`<div class="modal-inner"><div class="modal-title"><div><h2>${esc(title)}</h2><p>${esc(description)}</p></div><button type="button" class="icon-btn" data-action="close" aria-label="Tutup dialog">${ic('close')}</button></div>${html}</div>`;$('#dialog').showModal()}
function closeModal(){if($('#dialog').open)$('#dialog').close()}
function field(name,label,val='',opts=''){return `<div class="form-field"><label for="f-${name}">${esc(label)}</label><input class="field" id="f-${name}" name="${name}" value="${esc(val)}" ${opts}></div>`}
function sel(name,label,values,value){return `<div class="form-field"><label for="f-${name}">${esc(label)}</label><select name="${name}" id="f-${name}">${values.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function formButtons(label){return `<div class="modal-footer">${btn('close','Batal','btn-secondary')}<button class="btn btn-gold" type="submit">${ic('check')} ${esc(label)}</button></div>`}
function memberModal(current){const m=current||{name:'',whatsapp:'',plan:'vip',start:dateToday(),months:1,charge:db.settings.vip,paid:true,channel:'WhatsApp',note:''};modal(current?'Edit member':'Tambah member VIP',current?'Ubah data keanggotaan (riwayat pembayaran tidak ikut berubah).':'Isi identitas, paket, periode, dan status pembayaran.',`<form id="memberForm" data-id="${esc(current?.id||'')}"><div class="form-grid">${field('name','Nama member',m.name,'required maxlength="120"')}${field('whatsapp','WhatsApp (opsional)',m.whatsapp,'placeholder="08..." maxlength="40"')}${sel('plan','Paket',[['vip','VIP Umum'],['private','VIP Privat']],m.plan)}${field('start','Tanggal mulai',m.start,'type="date" required')}${sel('months','Durasi',[['1','1 bulan'],['2','2 bulan'],['3','3 bulan'],['6','6 bulan'],['12','12 bulan']],String(m.months))}${field('charge','Nominal pembayaran (Rp)',m.charge,'type="number" min="0" step="1" required')}${sel('channel','Sumber member',[['WhatsApp','WhatsApp'],['Instagram','Instagram'],['Telegram','Telegram'],['Referensi','Referensi'],['Lainnya','Lainnya']],m.channel)}${current?'':sel('paid','Status pembayaran',[['yes','Sudah lunas'],['no','Belum dibayar']],m.paid?'yes':'no')+field('paymentDate','Tanggal pembayaran',dateToday(),'type="date" required')+sel('method','Metode pembayaran',[['Transfer','Transfer'],['QRIS','QRIS'],['Tunai','Tunai'],['Lainnya','Lainnya']],'Transfer')}<div class="form-field full"><label for="f-note">Catatan (opsional)</label><textarea id="f-note" name="note" rows="2" maxlength="500" placeholder="Catatan member...">${esc(m.note)}</textarea></div></div>${current?'<p class="mini-sub">Jika ingin menambahkan pendapatan baru, gunakan tombol Terima Bayar atau Perpanjang.</p>':''}${formButtons(current?'Simpan perubahan':'Tambah member')}</form>`);if(!current){const plan=$('#f-plan'),price=$('#f-charge');plan.addEventListener('change',()=>{price.value=planPrice(plan.value)})}}
function renewModal(m){modal('Perpanjang membership',m.name+' · '+planText(m.plan),`<form id="renewForm" data-id="${esc(m.id)}"><div class="form-grid">${sel('months','Tambahan durasi',[['1','1 bulan'],['2','2 bulan'],['3','3 bulan'],['6','6 bulan'],['12','12 bulan']],'1')}${field('charge','Pembayaran diterima (Rp)',planPrice(m.plan),'type="number" min="0" required')}${field('date','Tanggal pembayaran',dateToday(),'type="date" required')}${sel('method','Metode pembayaran',[['Transfer','Transfer'],['QRIS','QRIS'],['Tunai','Tunai'],['Lainnya','Lainnya']],'Transfer')}</div><p class="mini-sub">Masa aktif saat ini sampai ${pretty(memberEnd(m))}. Perpanjangan dihitung dari tanggal yang lebih akhir antara hari ini dan akhir masa aktif saat ini.</p>${formButtons('Catat dan perpanjang')}</form>`)}
function payModal(m){modal('Terima pembayaran',m.name+' · '+planText(m.plan),`<form id="payForm" data-id="${esc(m.id)}"><div class="form-grid">${field('charge','Nominal diterima (Rp)',m.charge,'type="number" required min="0"')}${field('date','Tanggal pembayaran',dateToday(),'type="date" required')}${sel('method','Metode pembayaran',[['Transfer','Transfer'],['QRIS','QRIS'],['Tunai','Tunai'],['Lainnya','Lainnya']],'Transfer')}</div>${formButtons('Simpan pembayaran')}</form>`)}
function bookModal(b){const x=b||{title:'',category:'Dasar',description:'',price:0,link:'',enabled:true};modal(b?'Edit e-book':'Tambah e-book','Atur judul, keterangan, harga, dan tautan akses.',`<form id="bookForm" data-id="${esc(b?.id||'')}"><div class="form-grid"><div class="full">${field('title','Judul e-book',x.title,'required maxlength="160"')}</div>${sel('category','Kategori',[['Gratis','Gratis'],['Dasar','Dasar'],['Fundamental','Fundamental'],['Teknikal','Teknikal'],['Bandarmology','Bandarmology'],['Lainnya','Lainnya']],x.category)}${field('price','Harga (Rp, 0 = gratis)',x.price,'type="number" required min="0"') }<div class="form-field full"><label for="f-description">Deskripsi</label><textarea name="description" id="f-description" rows="3" maxlength="1000">${esc(x.description)}</textarea></div><div class="full">${field('link','Link unduhan / materi (opsional)',x.link,'type="url" placeholder="https://..."')}</div>${sel('enabled','Tampilkan di etalase',[['yes','Ya'],['no','Tidak']],x.enabled?'yes':'no')}</div>${formButtons(b?'Simpan e-book':'Tambah e-book')}</form>`)}
function bookSaleModal(book){const options=db.books.map(b=>[b.id,b.title]);if(!options.length){notify('Tambahkan e-book terlebih dahulu.',true);return}const b=book||db.books[0];modal('Catat transaksi e-book','Pembayaran dicatat secara manual, bukan melalui payment gateway.',`<form id="saleForm"><div class="form-grid">${sel('book','Produk e-book',options,b.id)}${field('buyer','Nama pembeli / penerima','','placeholder="Nama pelanggan" maxlength="120"')}${field('qty','Jumlah',1,'type="number" required min="1" max="10000"')}${field('amount','Total pembayaran (Rp)',b.price,'type="number" required min="0"')}${field('date','Tanggal transaksi',dateToday(),'type="date" required')}${sel('method','Metode pembayaran',[['Transfer','Transfer'],['QRIS','QRIS'],['Tunai','Tunai'],['Lainnya','Lainnya']],'Transfer')}</div><p class="mini-sub">E-book gratis dapat dicatat sebagai distribusi dengan nominal Rp0.</p>${formButtons('Simpan penjualan')}</form>`);const bookSelect=$('#f-book'),qty=$('#f-qty'),amount=$('#f-amount');function update(){const x=db.books.find(b=>b.id===bookSelect.value);amount.value=(x?.price||0)*Math.max(1,Number(qty.value)||1)}bookSelect.addEventListener('change',update);qty.addEventListener('input',update)}
function expenseModal(){modal('Catat pengeluaran','Biaya bisnis yang keluar pada tanggal tertentu.',`<form id="expenseForm"><div class="form-grid"><div class="full">${field('label','Keperluan','', 'required maxlength="180" placeholder="Contoh: Iklan Instagram"')}</div>${sel('category','Kategori',[['Pemasaran','Pemasaran'],['Operasional','Operasional'],['Produksi','Produksi'],['Perangkat lunak','Perangkat lunak'],['Lainnya','Lainnya']],'Operasional')}${field('amount','Nominal (Rp)',0,'type="number" required min="0"')}${field('date','Tanggal',dateToday(),'type="date" required')}${sel('method','Metode pembayaran',[['Transfer','Transfer'],['QRIS','QRIS'],['Tunai','Tunai'],['Lainnya','Lainnya']],'Transfer')}</div>${formButtons('Simpan pengeluaran')}</form>`)}
function val(form,name){return form.elements.namedItem(name)?.value?.trim()||''}
function saleRecord({date,kind,refId,label,buyer,qty,amount,method}){db.sales.push({id:uid(),date:validDate(date),kind,refId,label,buyer,qty,amount,method})}
function download(text,filename,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportFinance(){const records=[...salesIn(financeMonth).map(s=>[s.date,'Pemasukan',s.kind==='member'?'Member VIP':'E-book',s.label,s.buyer,s.method,s.amount]),...expensesIn(financeMonth).map(e=>[e.date,'Pengeluaran',e.category,e.label,'',e.method,-e.amount])].sort((a,b)=>b[0].localeCompare(a[0]));download(csv([['Tanggal','Jenis','Kategori','Keterangan','Nama','Metode','Jumlah (Rp)'],...records]),`YooImprove-Keuangan-${financeMonth}.csv`,'text/csv;charset=utf-8')}
function storeOrder(id){const b=db.books.find(x=>x.id===id);if(!b)return;const wa=db.settings.wa.replace(/\D/g,'');if(!wa){notify('Isi nomor WhatsApp bisnis di Pengaturan dulu.',true);return}const message=`Halo YooImprove, saya ingin ${b.price?'memesan':'meminta'} e-book "${b.title}" (${b.price?fmt(b.price):'Gratis'}). Mohon informasi selanjutnya.`;window.open(`https://wa.me/${wa}?text=${encodeURIComponent(message)}`,'_blank','noopener,noreferrer')}
function onClick(e){const nav=e.target.closest('[data-route]');if(nav){navigate(nav.dataset.route);return}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,member=db.members.find(m=>m.id===id),book=db.books.find(b=>b.id===id);switch(action){case'close':closeModal();break;case'go-dashboard':navigate('dashboard');break;case'go-store':navigate('store');break;case'go-members':navigate('members');break;case'go-finance':navigate('finance');break;case'go-settings':navigate('settings');break;case'add-member':memberModal();break;case'edit-member':if(member)memberModal(member);break;case'renew-member':if(member)renewModal(member);break;case'pay-member':if(member)payModal(member);break;case'delete-member':if(member&&confirm(`Hapus member ${member.name}? Riwayat transaksi lama tetap tersimpan.`)){db.members=db.members.filter(m=>m.id!==id);save();render();notify('Member dihapus; riwayat pembayaran tetap ada.')}break;case'add-book':bookModal();break;case'edit-book':if(book)bookModal(book);break;case'sell-book':bookSaleModal(book);break;case'delete-sale':{const s=db.sales.find(x=>x.id===id);if(s&&confirm(`Hapus transaksi ${s.label} sebesar ${fmt(s.amount)}?`)){db.sales=db.sales.filter(x=>x.id!==id);save();render();notify('Transaksi dihapus.')}break}case'add-expense':expenseModal();break;case'delete-expense':{const ex=db.expenses.find(x=>x.id===id);if(ex&&confirm(`Hapus pengeluaran ${ex.label}?`)){db.expenses=db.expenses.filter(x=>x.id!==id);save();render();notify('Pengeluaran dihapus.')}break}case'export-orders':{const sales=orderList();download(csv([['Tanggal','E-book','Pembeli','Qty','Metode','Nominal (Rp)'],...sales.map(s=>[s.date,s.label,s.buyer,s.qty,s.method,s.amount])]),'YooImprove-Penjualan-Ebook.csv','text/csv;charset=utf-8');break}case'export-finance':exportFinance();break;case'export-report':{const a=amountStats(reportMonth);download(csv([['Metrik','Nilai'],['Bulan',reportMonth],['Member baru',db.members.filter(m=>m.start.slice(0,7)===reportMonth).length],['Omzet VIP',a.member],['Omzet E-book',a.ebooks],['Total omzet',a.total],['Pengeluaran',a.spent],['Selisih bersih',a.net]]),`YooImprove-Laporan-${reportMonth}.csv`,'text/csv;charset=utf-8');break}case'backup':download(JSON.stringify(db,null,2),`YooImprove-Backup-${dateToday()}.json`,'application/json');notify('File cadangan dibuat.');break;case'restore':$('#restoreInput').click();break;case'clear-demo':if(confirm('Hapus semua data simulasi dan mulai dengan bisnis kosong?')){db=blank();save();render();notify('Data simulasi telah dihapus.')}break;case'reset':if(confirm('Hapus SEMUA data YooImprove yang tersimpan di browser ini? Tindakan ini tidak bisa dibatalkan.')){db=blank();save();render();notify('Data lokal dikosongkan.')}break;case'store-wa':storeOrder(id);break;case'store-books':$('#storeBooks')?.scrollIntoView({behavior:'smooth'});break;}}
function onSubmit(e){const f=e.target;if(!['memberForm','renewForm','payForm','bookForm','saleForm','expenseForm','settingsForm'].includes(f.id))return;e.preventDefault();try{switch(f.id){case'memberForm':{const old=db.members.find(m=>m.id===f.dataset.id),entry={id:old?.id||uid(),name:val(f,'name'),whatsapp:val(f,'whatsapp'),plan:val(f,'plan'),start:validDate(val(f,'start')),months:parseInt(val(f,'months'),10),charge:pos(val(f,'charge')),paid:old?.paid??(val(f,'paid')==='yes'),channel:val(f,'channel'),note:val(f,'note')};if(!entry.name)throw Error('Nama wajib diisi.');if(old){Object.assign(old,entry)}else{db.members.push(entry);if(entry.paid)saleRecord({date:val(f,'paymentDate'),kind:'member',refId:entry.id,label:planText(entry.plan),buyer:entry.name,qty:1,amount:entry.charge,method:val(f,'method')})}break}
case'payForm':{const m=db.members.find(m=>m.id===f.dataset.id);if(!m||m.paid)throw Error('Pembayaran sudah tercatat.');m.charge=pos(val(f,'charge'));m.paid=true;saleRecord({date:val(f,'date'),kind:'member',refId:m.id,label:planText(m.plan),buyer:m.name,qty:1,amount:m.charge,method:val(f,'method')});break}
case'renewForm':{const m=db.members.find(m=>m.id===f.dataset.id);if(!m)throw Error('Member tidak ditemukan.');const end=memberEnd(m),renewStart=end<dateToday()?dateToday():addDays(end,1);m.start=renewStart;m.months=parseInt(val(f,'months'),10);m.charge=pos(val(f,'charge'));m.paid=true;saleRecord({date:val(f,'date'),kind:'member',refId:m.id,label:'Perpanjangan '+planText(m.plan),buyer:m.name,qty:1,amount:m.charge,method:val(f,'method')});break}
case'bookForm':{const title=val(f,'title'),link=val(f,'link');if(!title)throw Error('Judul e-book wajib diisi.');if(link&&!validURL(link))throw Error('Tautan harus berupa http/https yang valid.');const data={title,category:val(f,'category'),price:pos(val(f,'price')),description:val(f,'description'),link:validURL(link),enabled:val(f,'enabled')==='yes'},old=db.books.find(b=>b.id===f.dataset.id);if(old)Object.assign(old,data);else db.books.push({...data,id:uid()});break}
case'saleForm':{const b=db.books.find(b=>b.id===val(f,'book'));if(!b)throw Error('E-book tidak ditemukan.');saleRecord({date:val(f,'date'),kind:'ebook',refId:b.id,label:b.title,buyer:val(f,'buyer')||'Tanpa nama',qty:Math.trunc(pos(val(f,'qty'))),amount:pos(val(f,'amount')),method:val(f,'method')});if(pos(val(f,'qty'))<1)throw Error('Jumlah minimal 1.');break}
case'expenseForm':{if(!val(f,'label'))throw Error('Keperluan wajib diisi.');db.expenses.push({id:uid(),label:val(f,'label'),category:val(f,'category'),amount:pos(val(f,'amount')),date:validDate(val(f,'date')),method:val(f,'method')});break}
case'settingsForm':{db.settings={name:val(f,'name'),wa:val(f,'wa').replace(/\D/g,'').slice(0,20),instagram:val(f,'instagram'),vip:pos(val(f,'vip')),private:pos(val(f,'private'))};if(!db.settings.name)throw Error('Nama brand wajib diisi.');break}}
if(save()){closeModal();render();notify('Data berhasil disimpan.')}}catch(error){notify(error.message||'Gagal memproses data.',true)}}
function updateSearch(el){const id=el.id,q=el.value;const p=el.selectionStart;if(id==='memberSearch')memberQuery=q;else if(id==='bookSearch')bookQuery=q;else if(id==='orderSearch')orderQuery=q;else return;render();const newEl=$('#'+id);if(newEl){newEl.focus();try{newEl.setSelectionRange(p,p)}catch{}}}
document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);
document.addEventListener('input',e=>{if(['memberSearch','bookSearch','orderSearch'].includes(e.target.id))updateSearch(e.target)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='memberFilter'){memberFilter=t.value;render()}else if(t.id==='financeMonth'){financeMonth=t.value;render()}else if(t.id==='reportMonth'){reportMonth=t.value;render()}});
$('#restoreInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=validate(JSON.parse(await file.text()));if(confirm('Pulihkan cadangan? Semua data YooImprove dalam browser ini akan diganti.')){db=obj;save();render();notify('Cadangan berhasil dipulihkan.')}}catch(error){notify('Cadangan tidak valid: '+error.message,true)}e.target.value=''});
$('#overlay').addEventListener('click',()=>{$('#sidebar')?.classList.remove('open');$('#overlay').classList.remove('active')});
document.addEventListener('click',e=>{if(e.target.closest('#menuBtn')){$('#sidebar')?.classList.toggle('open');$('#overlay').classList.toggle('active')}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(ROUTES[r]&&route!==r)navigate(r)});
render();
})();
</script>
