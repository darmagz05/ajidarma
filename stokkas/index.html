    <section class="card section-card" style="margin-bottom:19px"><div class="section-header"><div><h3 class="section-title">Tren omzet 7 hari terakhir</h3><p class="section-subtitle">Grafik tetap 7 hari, sedangkan angka ringkasan mengikuti filter periode.</p></div></div>${chart(db.transactions)}</section>
    <div class="report-insights"><section class="card section-card"><div class="section-header"><div><h3 class="section-title">Produk terlaris</h3><p class="section-subtitle">Berdasarkan nilai penjualan</p></div></div><div class="rank-list">${ranked.length?ranked.map(([name,v],i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><div class="rank-details"><strong>${esc(name)}</strong><small>${number(v.qty)} unit terjual</small></div><strong class="rank-price">${rupiah(v.total)}</strong></div>`).join(''):empty('Belum ada data','Lakukan transaksi untuk melihat produk terlaris.')}</div></section>
    <section class="card section-card"><div class="section-header"><div><h3 class="section-title">Metode pembayaran</h3><p class="section-subtitle">Distribusi omzet berdasarkan jenis pembayaran</p></div></div><div class="breakdown">${breakdown.length?breakdown.map(([name,val])=>`<div><div class="breakdown-row"><span>${esc(name)}</span><b>${rupiah(val)} (${t.revenue?Math.round(val/t.revenue*100):0}%)</b></div><div class="bar-track"><div class="bar-fill" style="width:${t.revenue?val/t.revenue*100:0}%"></div></div></div>`).join(''):empty('Belum ada data','Metode pembayaran ditampilkan setelah ada transaksi.')}</div><div class="notice">${icon('info')} Laba kotor bukan laba bersih; biaya sewa, gaji, ongkir, dan biaya usaha lainnya belum dihitung.</div></section></div>`;
  }
  function renderSettings(){const s=db.settings;return `${header('Pengaturan toko','Sesuaikan identitas toko dan cadangkan data penting.','','KONFIGURASI')}${demoBanner()}
    <div class="settings-grid"><section class="card settings-card"><h3 class="section-title">Profil toko</h3><p class="section-subtitle">Informasi ini digunakan dalam struk transaksi.</p><form id="settingsForm"><div class="form-grid"><div class="form-field full-span"><label for="storeName">Nama toko *</label><input id="storeName" name="storeName" required maxlength="100" value="${esc(s.storeName)}"></div><div class="form-field"><label for="owner">Nama pemilik</label><input id="owner" name="owner" maxlength="100" value="${esc(s.owner)}"></div><div class="form-field"><label for="phone">Nomor telepon</label><input id="phone" name="phone" maxlength="40" value="${esc(s.phone)}"></div><div class="form-field full-span"><label for="address">Alamat toko</label><input id="address" name="address" maxlength="200" value="${esc(s.address)}"></div><div class="form-field full-span"><label for="lowStock">Batas stok minimum default</label><input id="lowStock" name="lowStock" type="number" min="0" max="999999" step="1" value="${s.lowStock}"></div></div><button class="btn btn-primary" type="submit">${icon('check')} Simpan Pengaturan</button></form></section>
    <section class="card settings-card"><h3 class="section-title">Data & keamanan</h3><p class="section-subtitle">Semua data disimpan di perangkat ini, bukan di cloud.</p><div class="action-stack"><div class="settings-action"><div><strong>Unduh cadangan JSON</strong><small>Salin seluruh produk, transaksi, dan pengaturan.</small></div>${button('backup',icon('download'),'btn-secondary btn-small','aria-label="Unduh cadangan"')}</div><div class="settings-action"><div><strong>Pulihkan data</strong><small>Impor berkas cadangan StokKas. Data lama ditimpa.</small></div>${button('import',icon('upload'),'btn-secondary btn-small','aria-label="Pulihkan data"')}</div><div class="settings-action"><div><strong>Muat data contoh</strong><small>Ganti data sekarang dengan contoh untuk latihan.</small></div>${button('load-demo','Demo','btn-secondary btn-small')}</div><div class="settings-action"><div><strong>Hapus seluruh data</strong><small>Reset transaksi dan produk agar mulai dari nol.</small></div>${button('reset','Reset','btn-danger btn-small')}</div></div><div class="notice">${icon('info')} Penting: data dapat hilang jika aplikasi dihapus atau penyimpanan perangkat dibersihkan. Unduh cadangan secara rutin.</div></section></div>`;}
  function render(){syncCart();const routeRender={dashboard:renderDashboard,products:renderProducts,pos:renderPOS,history:renderHistory,reports:renderReports,settings:renderSettings};$('#view').innerHTML=routeRender[currentRoute]();$('#topDate').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'});}
  function modal(body){$('#modalContent').innerHTML=body;const dialog=$('#modal');if(!dialog.open)dialog.showModal();}
  function closeModal(){const dialog=$('#modal');if(dialog.open)dialog.close();}
  function modalShell(title,desc,contents){return `<div class="modal-pad"><div class="modal-header"><div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div><button type="button" data-action="close-modal" class="modal-close" aria-label="Tutup">${icon('close')}</button></div>${contents}</div>`;}
  function productModal(pid){const p=pid?db.products.find(v=>v.id===pid):null;if(pid&&!p){toast('Produk tidak ditemukan',true);return;}
    modal(modalShell(p?'Edit produk':'Tambah produk',p?'Perbarui informasi barang.':'Lengkapi detail barang baru.',`<form id="productForm" data-id="${esc(p?.id||'')}"><div class="form-grid"><div class="form-field full-span"><label>Nama produk *</label><input name="name" required maxlength="120" autocomplete="off" value="${esc(p?.name||'')}" placeholder="Contoh: Gula Pasir 1 kg"></div><div class="form-field"><label>SKU / kode</label><input name="sku" maxlength="70" value="${esc(p?.sku||'')}" placeholder="PRD-001"></div><div class="form-field"><label>Kategori</label><input name="category" maxlength="60" value="${esc(p?.category||'Sembako')}" placeholder="Sembako"></div><div class="form-field"><label>Harga jual (Rp) *</label><input name="price" type="number" inputmode="numeric" min="0" max="999999999999" step="1" required value="${esc(p?.price??'')}"></div><div class="form-field"><label>Harga modal (Rp)</label><input name="cost" type="number" inputmode="numeric" min="0" max="999999999999" step="1" value="${esc(p?.cost??0)}"></div><div class="form-field"><label>Stok saat ini *</label><input name="stock" type="number" inputmode="numeric" min="0" max="999999999" step="1" required value="${esc(p?.stock??0)}"></div><div class="form-field"><label>Batas stok minimum *</label><input name="minStock" type="number" inputmode="numeric" min="0" max="999999999" step="1" required value="${esc(p?.minStock??db.settings.lowStock)}"></div></div><div class="modal-actions">${button('close-modal','Batal','btn-secondary')}<button class="btn btn-primary" type="submit">${icon('check')} ${p?'Simpan Perubahan':'Tambah Produk'}</button></div></form>`));
  }
  function storeProduct(form){const fd=new FormData(form),pid=form.dataset.id,existing=db.products.find(p=>p.id===pid),name=String(fd.get('name')||'').trim(),sku=String(fd.get('sku')||'').trim(),category=String(fd.get('category')||'').trim()||'Lainnya';
    const vals=['price','cost','stock','minStock'].map(k=>money(fd.get(k)));if(!name||vals.some(x=>!Number.isSafeInteger(x)||x<0)){toast('Lengkapi produk dengan nilai yang valid.',true);return;}
    if(sku&&db.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==pid)){toast('SKU sudah digunakan produk lain.',true);return;}
    const p={id:pid||id(),name,sku,category,price:vals[0],cost:vals[1],stock:vals[2],minStock:vals[3],createdAt:existing?.createdAt||new Date().toISOString()};
    const next=structuredClone(db);if(existing)next.products=next.products.map(a=>a.id===pid?p:a);else next.products.push(p);
    if(persist(next)){closeModal();render();toast(existing?'Produk berhasil diperbarui.':'Produk baru berhasil ditambahkan.');}
  }
  function confirmModal(title,description,onConfirmLabel,action,idValue=''){modal(modalShell(title,description,`<div class="notice" style="background:#fff7ef;border-color:#f5e0cb;color:#8c6243">${icon('alert')} Tindakan ini tidak dapat dibatalkan. Buat cadangan terlebih dahulu jika perlu.</div><div class="modal-actions">${button('close-modal','Batal','btn-secondary')}<button class="btn btn-danger" type="button" data-action="${action}" data-id="${esc(idValue)}">${esc(onConfirmLabel)}</button></div>`));}
  function doDeleteProduct(pid){const p=db.products.find(x=>x.id===pid);if(!p)return;confirmModal(`Hapus ${p.name}?`,'Riwayat transaksi lama tetap disimpan sebagai snapshot.','Ya, hapus','confirm-delete-product',pid);}
  function updateQty(pid,add){const p=db.products.find(x=>x.id===pid);if(!p)return;const previous=cart.get(pid)||0,next=previous+add;if(next>p.stock){toast('Jumlah melebihi stok tersedia.',true);return;}if(next<=0)cart.delete(pid);else cart.set(pid,next);render();}
  function checkout(){syncCart();if(!cart.size){toast('Keranjang masih kosong.',true);return;}
    const items=cartData().map(({p,qty})=>({productId:p.id,name:p.name,sku:p.sku,price:p.price,cost:p.cost,qty}));
    if(items.some(it=>{const p=db.products.find(p=>p.id===it.productId);return !p||p.stock<it.qty;})){toast('Stok berubah. Periksa ulang keranjang.',true);render();return;}
    const t=cartTotals();const paid=method==='Tunai'?money(cashInput):t.total;
    if(!Number.isSafeInteger(paid)||paid<t.total){toast('Jumlah uang diterima masih kurang.',true);return;}
    const next=structuredClone(db);items.forEach(it=>{next.products.find(p=>p.id===it.productId).stock-=it.qty;});
    const now=new Date().toISOString();const tx={id:`SK-${dateKey(new Date()).replaceAll('-','')}-${Date.now().toString().slice(-6)}-${Math.random().toString(36).slice(2,5).toUpperCase()}`,date:now,items,subtotal:t.subtotal,discount:t.discount,total:t.total,paid,change:paid-t.total,method};next.transactions.push(tx);
    if(persist(next)){cart.clear();discount=0;method='Tunai';cashInput='';render();toast('Transaksi berhasil disimpan. Stok diperbarui.');receiptModal(tx.id);}
  }
  function receiptHTML(t){return `<div class="receipt-paper" id="receiptPaper" style="background:white;padding:22px;border:1px dashed #d1ddd3;border-radius:10px;color:#1b3023"><div style="text-align:center"><strong style="font-size:20px">${esc(db.settings.storeName)}</strong><div style="font-size:11px;margin-top:6px;color:#73877a">${esc(db.settings.address)} ${db.settings.phone?'<br>'+esc(db.settings.phone):''}</div></div><hr style="border:0;border-top:1px dashed #b4c1b8;margin:17px 0"><div class="flex-between"><span class="label-muted">No.</span><b class="id-tag">${esc(t.id)}</b></div><div class="flex-between" style="margin-top:8px"><span class="label-muted">Tanggal</span><span style="font-size:11px">${esc(formatTime(t.date))}</span></div><hr style="border:0;border-top:1px dashed #b4c1b8;margin:17px 0"><div class="receipt-list">${t.items.map(it=>`<div class="flex-between" style="align-items:start"><div><strong style="font-size:12px">${esc(it.name)}</strong><div class="label-muted" style="margin-top:5px">${it.qty} × ${rupiah(it.price)}</div></div><strong style="font-size:12px">${rupiah(it.qty*it.price)}</strong></div>`).join('')}</div><hr style="border:0;border-top:1px dashed #b4c1b8;margin:17px 0"><div class="totals"><div class="total-line"><span>Subtotal</span><strong>${rupiah(t.subtotal)}</strong></div><div class="total-line"><span>Diskon</span><strong>${rupiah(t.discount)}</strong></div><div class="total-line grand"><span>Total</span><strong>${rupiah(t.total)}</strong></div><div class="total-line"><span>${esc(t.method)}</span><strong>${rupiah(t.paid)}</strong></div><div class="total-line"><span>Kembalian</span><strong>${rupiah(t.change)}</strong></div></div><p style="text-align:center;color:#788b7c;font-size:11px;margin-top:22px">Terima kasih sudah berbelanja!</p></div>`;}
  function receiptModal(tid){const tx=db.transactions.find(t=>t.id===tid);if(!tx){toast('Transaksi tidak ditemukan.',true);return;}modal(modalShell('Detail transaksi','Struk dapat dicetak atau disimpan sebagai PDF melalui menu Print.',`${receiptHTML(tx)}<div class="modal-actions">${button('close-modal','Tutup','btn-secondary')}<button type="button" class="btn btn-primary" data-action="print-receipt" data-id="${esc(tx.id)}">${icon('receipt')} Cetak Struk</button></div>`));}
  function printReceipt(tid){const tx=db.transactions.find(t=>t.id===tid);if(!tx)return;const receipt=receiptHTML(tx);
    const target=$('#receiptPrintArea')||document.createElement('section');target.id='receiptPrintArea';target.innerHTML=receipt;document.body.appendChild(target);window.print();}
  function download(name,content,type){const blob=new Blob([content],{type}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove();},1500);}
  function backup(){download(`StokKas-backup-${dateKey(new Date())}.json`,JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Cadangan JSON diunduh. Simpan di tempat aman.');}
  function csvExport(){const quote=v=>`"${String(v??'').replaceAll('"','""')}"`;const rows=[['ID','Tanggal','Metode','Produk','SKU','Jumlah','Harga Satuan','Subtotal Barang','Subtotal Nota','Diskon Nota','Total Nota']];
    [...db.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(t=>t.items.forEach(it=>rows.push([t.id,formatTime(t.date),t.method,it.name,it.sku,it.qty,it.price,it.qty*it.price,t.subtotal,t.discount,t.total])));
    download(`StokKas-transaksi-${dateKey(new Date())}.csv`,'\ufeff'+rows.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Laporan CSV berhasil diunduh.');}
  function restore(file){if(!file)return;if(file.size>25*1024*1024){toast('Cadangan melebihi 25 MB.',true);return;}const reader=new FileReader();reader.onload=()=>{try{const result=validateImport(JSON.parse(reader.result));if(!confirm(`Pulihkan ${result.products.length} produk dan ${result.transactions.length} transaksi? Data di perangkat ini akan digantikan.`))return;
        if(persist(result)){cart.clear();discount=0;method='Tunai';cashInput='';navigate('dashboard');toast('Cadangan berhasil dipulihkan.');}}
      catch(err){toast(`Gagal impor: ${err.message}`,true);}};reader.onerror=()=>toast('Gagal membaca berkas.',true);reader.readAsText(file);}
  function updateSearchFocus(fieldName,value){const el=$(fieldName);if(!el)return;el.value=value;el.focus();try{el.setSelectionRange(value.length,value.length);}catch(_){}}
  function updatePOSAmounts(){const total=cartTotals(),sub=$('#subtotalValue'),dis=$('#discountValue'),grand=$('#totalValue'),change=$('#changeValue');if(sub)sub.textContent=rupiah(total.subtotal);if(dis)dis.textContent=`− ${rupiah(total.discount)}`;if(grand)grand.textContent=rupiah(total.total);if(change)change.textContent=rupiah(Math.max(0,(+cashInput||0)-total.total));}
  document.addEventListener('click',event=>{
    const route=event.target.closest('[data-route]');if(route){navigate(route.dataset.route);return;}
    const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,pid=el.dataset.id;
    switch(action){
      case 'go-pos':navigate('pos');break;case 'go-products':navigate('products');break;
      case 'add-product':productModal();break;case 'edit-product':productModal(pid);break;
      case 'delete-product':doDeleteProduct(pid);break;
      case 'confirm-delete-product':{const next=structuredClone(db);next.products=next.products.filter(p=>p.id!==pid);if(persist(next)){cart.delete(pid);closeModal();render();toast('Produk dihapus. Riwayat penjualan tetap tersedia.');}break;}
      case 'cart-add':updateQty(pid,1);break;case 'cart-minus':updateQty(pid,-1);break;
      case 'clear-cart':cart.clear();discount=0;cashInput='';render();break;case 'checkout':checkout();break;
      case 'view-receipt':receiptModal(pid);break;case 'print-receipt':printReceipt(pid);break;
      case 'backup':backup();break;case 'export-csv':csvExport();break;case 'import':$('#importFile').click();break;
      case 'close-modal':closeModal();break;
      case 'reset':case 'clear-demo':confirmModal('Mulai dari awal?','Semua produk dan transaksi akan dihapus dari perangkat.','Ya, hapus semua','confirm-reset');break;
      case 'confirm-reset':if(persist(emptyData())){cart.clear();productQuery='';posQuery='';historyQuery='';discount=0;cashInput='';closeModal();navigate('dashboard');toast('StokKas siap untuk data toko yang baru.');}break;
      case 'load-demo':confirmModal('Ganti ke data demo?','Produk dan transaksi saat ini akan diganti dengan data latihan.','Ya, gunakan demo','confirm-demo');break;
      case 'confirm-demo':if(persist(sampleData())){cart.clear();closeModal();navigate('dashboard');toast('Data contoh berhasil dimuat.');}break;
    }
  });
  document.addEventListener('submit',event=>{if(event.target.id==='productForm'){event.preventDefault();storeProduct(event.target);}if(event.target.id==='settingsForm'){event.preventDefault();const fd=new FormData(event.target),next=structuredClone(db),storeName=String(fd.get('storeName')||'').trim(),lowStock=money(fd.get('lowStock'));if(!storeName||!Number.isSafeInteger(lowStock)||lowStock<0||lowStock>999999){toast('Nama toko atau batas stok tidak valid.',true);return;}next.settings={storeName,owner:String(fd.get('owner')||'').trim(),phone:String(fd.get('phone')||'').trim(),address:String(fd.get('address')||'').trim(),lowStock};if(persist(next)){render();toast('Pengaturan toko berhasil disimpan.');}}});
  document.addEventListener('input',event=>{const el=event.target;
    if(el.id==='productSearch'){productQuery=el.value;const rows=db.products.filter(p=>[p.name,p.sku,p.category].some(x=>x.toLowerCase().includes(productQuery.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name,'id'));$('.card .table-scroll')?.remove();const card=$('.toolbar + .card');if(card)card.innerHTML=productRows(rows);}
    else if(el.id==='posSearch'){posQuery=el.value;const focus=el.selectionStart;render();updateSearchFocus('#posSearch',posQuery);try{$('#posSearch').setSelectionRange(focus,focus);}catch(_){}}
    else if(el.id==='historySearch'){historyQuery=el.value;const focus=el.selectionStart;render();updateSearchFocus('#historySearch',historyQuery);try{$('#historySearch').setSelectionRange(focus,focus);}catch(_){}}
    else if(el.id==='discount'){discount=Number.isFinite(+el.value)?Math.max(0,Math.floor(+el.value)):0;updatePOSAmounts();}
    else if(el.id==='paid'){cashInput=el.value;updatePOSAmounts();}
  });
  document.addEventListener('change',event=>{const el=event.target;if(el.id==='method'){method=el.value;render();}else if(el.id==='historyPeriod'){historyPeriod=el.value;render();}else if(el.id==='reportPeriod'){reportPeriod=el.value;render();}else if(el.id==='importFile'){restore(el.files?.[0]);el.value='';}});
  $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open');});
  if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform?.() && /^https?:$/.test(location.protocol)) {navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:',err));}
  const start=location.hash.replace('#','');navigate(ROUTES[start]?start:'dashboard');
  window.addEventListener('hashchange',()=>{const value=location.hash.slice(1);if(ROUTES[value]&&value!==currentRoute)navigate(value);});
})();

</script>
</body>
</html>
